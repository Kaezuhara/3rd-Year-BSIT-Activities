<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Delivery</title>
</head>
<style>
  section{
    margin-bottom: 20px;
  }

  p{
    margin: 0;
  }

  .textInput{
    margin-top: 5px;
  }
</style>
<body>
 
  <form>
    <!-- FLAVOR -->
    <section>
      <p>Choose a FLAVOR</p>
        <input type="checkbox" id="flavor-pepperoni" name="flavor" value="Pepperoni">
        <label for="flavor-pepperoni">Pepperoni</label>

      <div>
        <input type="checkbox" id="flavor-ham-cheese" name="flavor" value="Ham & Cheese">
        <label for="flavor-ham-cheese">Ham & Cheese</label>
      </div>

      <div>
        <input type="checkbox" id="flavor-bacon" name="flavor" value="Bacon">
        <label for="flavor-bacon">Bacon</label>
      </div>

      <div>
        <input type="checkbox" id="flavor-hawaiian" name="flavor" value="Hawaiian">
        <label for="flavor-hawaiian">Hawaiian</label>
      </div>
    </section>

    <!-- SIZE -->
    <section>
      <p>Choose a SIZE</p>
      <div>
        <input type="radio" id="size-small" name="size" value="Small">
        <label for="size-small">Small</label>
      </div>

      <div>
        <input type="radio" id="size-medium" name="size" value="Medium">
        <label for="size-medium">Medium</label>
      </div>

      <div>
        <input type="radio" id="size-large" name="size" value="Large">
        <label for="size-large">Large</label>
      </div>

      <div>
        <input type="radio" id="size-xlarge" name="size" value="X-Large">
        <label for="size-xlarge">X-Large</label>
      </div>
    </section>

    <!-- INFORMATION -->
    <section>
      <div class="textInput">
        <input type="text" name="customer_name" placeholder="Enter your name">
      </div>

      <div class="textInput">
        <input type="text" name="customer_email" placeholder="Enter your email">
      </div>

      <div class="textInput">
        <input type="tel" name="customer_phone" placeholder="Enter your phone number">
      </div>

      <div class="textInput">
        <input type="text" name="customer_address" placeholder="Enter your address">
      </div>
    </section>

    <section>
      <div>
        <button type="submit">Submit Order</button>
      </div>
    </section>
  </form>
</body>
</html>
